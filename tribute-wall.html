<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribute Wall - Over the Rainbow</title>
    <style>
        /* 1. Global Setup with Wallpaper */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('assets/images/rainbow-bridge.jpg') !important;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        /* 2. Navigation Styling */
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2); 
            display: flex;
            justify-content: center;
        }

        nav ul li { margin: 0 15px; }

        nav ul li a {
            text-decoration: none;
            color: #5D3FD3 !important;
            font-weight: bold;
        }

        /* 3. Main Content (Centered & Transparent) */
        main {
            max-width: 800px;
            margin: 40px auto; 
            padding: 30px;
            text-align: center;
            background: transparent !important;
        }

        h1, p {
            color: #5D3FD3 !important;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }

        /* 4. Tribute Card Styling */
        .tribute-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tribute-card {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #5D3FD3;
            text-align: left;
            color: #5D3FD3;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="tribute-wall.html">Tribute Wall</a></li>
            <li><a href="assets/customize.html">Customize</a></li>
            <li><a href="virtual-shop.html">Virtual Shop</a></li>
            <li><a href="healing-agent.html">Healing Agent</a></li>
            <li><a href="memorial-builder.html">Memorial Builder</a></li>
        </ul>
    </nav>

    <main>
        <h1>Tribute Wall</h1>
        <p>A place for love, memories, and shared stories.</p>

        <!-- This is where tributes will appear -->
        <div id="tributeWall" class="tribute-container"></div>
    </main>

    <script>
    function loadTributes() {
        const tributes = JSON.parse(localStorage.getItem("tributes")) || [];
        const wall = document.getElementById("tributeWall");

        wall.innerHTML = ""; // Clear placeholder examples

        tributes.forEach(t => {
            const entry = document.createElement("div");
            entry.className = "tribute-card";
            entry.innerHTML = `
                <strong>${t.name} (${t.birth} – ${t.passing})</strong>
                <p><strong>Type:</strong> ${t.type}</p>
                <p>${t.message}</p>
            `;
            wall.appendChild(entry);
        });
    }

    loadTributes();
    </script>
</body>
</html>
