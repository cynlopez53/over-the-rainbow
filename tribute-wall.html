<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribute Wall - Over the Rainbow</title>

    <style>
        /* HERO SECTION */
        .hero-section {
            width: 100%;
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(135deg, #ffb6d5, #c8a8ff);
            color: white;
        }

        .hero-section h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .hero-section p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto 20px;
        }

        .hero-section .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #ff6fa8;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .hero-section .btn:hover {
            background: #ff8fc0;
        }

        /* TRIBUTE WALL CONTENT */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            text-align: center;
        }

        h1, p {
            color: #5D3FD3;
        }

        .tribute-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tribute-card {
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #5D3FD3;
            text-align: left;
            color: #5D3FD3;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="tribute-wall.html">Tribute Wall</a></li>
            <li><a href="assets/customize.html">Customize</a></li>
            <li><a href="shop.html">Virtual Shop</a></li>
            <li><a href="healing-agent.html">Healing Agent</a></li>
            <li><a href="memorial-builder.html">Memorial Builder</a></li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero-section">
        <h1>Tribute Wall</h1>
        <p>Honor and remember the beloved companions who have crossed the rainbow bridge.</p>
        <a href="submit-tribute.html" class="btn">Submit a Tribute</a>
    </section>

    <!-- TRIBUTE CONTENT -->
    <main>
        <div id="tributeWall" class="tribute-container"></div>
    </main>

    <script>
        function loadTributes() {
            const tributes = JSON.parse(localStorage.getItem("tributes")) || [];
            const wall = document.getElementById("tributeWall");

            wall.innerHTML = "";

            tributes.forEach(t => {
                const entry = document.createElement("div");
                entry.className = "tribute-card";
                entry.innerHTML = `
                    <strong>${t.name} (${t.birth} – ${t.passing})</strong>
                    <p><strong>Type:</strong> ${t.type}</p>
                    <p>${t.message}</p>
                `;
                wall.appendChild(entry);
            });
        }

        loadTributes();
    </script>

</body>
</html>
