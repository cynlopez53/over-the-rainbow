<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial Builder - Over the Rainbow</title>
    <style>
        /* 1. Page Background & Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Points to the image folder */
            background-image: url('assets/images/rainbow-bridge.jpg') !important;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 2. Navigation Styling */
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2); 
            display: flex;
            justify-content: center;
        }

        nav ul li { margin: 0 15px; }

        nav ul li a {
            text-decoration: none;
            color: #5D3FD3 !important; /* Dark Lavender */
            font-weight: bold;
        }

        /* 3. Main Content (Centered & Transparent) */
        main {
            flex: 1;
            max-width: 600px;
            margin: 40px auto; 
            padding: 30px;
            text-align: center;
            background: transparent !important;
        }

        h1, p, label {
            color: #5D3FD3 !important; /* Dark Lavender */
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }

        /* 4. Form Styling for the screen */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .form-group {
            width: 100%;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #5D3FD3;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
        }

        button {
            background-color: #5D3FD3;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li>[Home](index.html)</li>
            <li>[Tribute Wall](tribute-wall.html)</li>
            <li>[Customize](assets/customize.html)</li>
            <li>[Virtual Shop](virtual-shop.html)</li>
            <li>[Healing Agent](healing-agent.html)</li>
            <li>[Memorial Builder](memorial-builder.html)</li>
        </ul>
    </nav>

    <main>
        <h1>Memorial Builder</h1>
        <p>Create a personalized memorial for your pet.</p>

        <form>
            <div class="form-group">
                <label for="petName">Pet Name</label>
                <input type="text" id="petName" placeholder="Enter your pet's name">
            </div>

            <div class="form-group">
                <label for="petType">Pet Type</label>
                <input type="text" id="petType" placeholder="e.g., Dog, Cat, Bird">
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date</label>
                <input type="date" id="birthDate">
            </div>

            <div class="form-group">
                <label for="passingDate">Passing Date</label>
                <input type="date" id="passingDate">
            </div>

            <div class="form-group">
                <label for="message">Memorial Message</label>
                <textarea id="message" rows="4" placeholder="Share a special memory..."></textarea>
            </div>

            <button type="button">Build Memorial</button>
        </form>
    </main>

</body>
</html>
