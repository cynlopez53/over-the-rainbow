<h1>Memorial Builder</h1>
<p style="text-align:center;">Create a personalized memorial for your pet.</p>

<form id="memorialForm">
  <label>Pet Name</label>
  <input id="petName" type="text" required>

  <label>Pet Type</label>
  <input id="petType" type="text" required>

  <label>Birth Date</label>
  <input id="birthDate" type="date" required>

  <label>Passing Date</label>
  <input id="passingDate" type="date" required>

  <label>Memorial Message</label>
  <textarea id="memorialMessage" rows="4" required></textarea>

  <button type="submit">Build Memorial</button>
</form>

<div id="memorialOutput"></div>

<footer>© 2026 Over the Rainbow</footer>

<script>
document.getElementById("memorialForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("petName").value;
  const type = document.getElementById("petType").value;
  const birth = document.getElementById("birthDate").value;
  const passing = document.getElementById("passingDate").value;
  const message = document.getElementById("memorialMessage").value;

  const tribute = `
    <h2>🌈 Memorial for ${name}</h2>
    <p><strong>Type:</strong> ${type}</p>
    <p><strong>Born:</strong> ${birth}</p>
    <p><strong>Passed:</strong> ${passing}</p>
    <p><em>${message}</em></p>
  `;

  document.getElementById("memorialOutput").innerHTML = tribute;
});
</script>
