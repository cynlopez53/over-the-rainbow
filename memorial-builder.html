<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="tribute-wall.html">Tribute Wall</a></li>

        </ul>
    </nav>

    <main>
        <h1>Create a Memorial</h1>
        <p>Build a beautiful tribute for your beloved pet</p>
        
        <form id="memorialForm">
            <div class="form-group">
                <label for="petName">Pet's Name:</label>
                <input type="text" id="petName" name="petName" required>
            </div>
            
            <div class="form-group">
                <label for="petType">Type of Pet:</label>
                <select id="petType" name="petType" required>
                    <option value="">Select...</option>
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Bird">Bird</option>
                    <option value="Rabbit">Rabbit</option>
                    <option value="Hamster">Hamster</option>
                    <option value="Fish">Fish</option>
                    <option value="Horse">Horse</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="birthDate">Birth Date (optional):</label>
                <input type="date" id="birthDate" name="birthDate">
            </div>
            
            <div class="form-group">
                <label for="passingDate">Passing Date (optional):</label>
                <input type="date" id="passingDate" name="passingDate">
            </div>
            
            <div class="form-group">
                <label for="memorialMessage">Special Message:</label>
                <textarea id="memorialMessage" name="memorialMessage" rows="4" 
                          placeholder="Share a special memory or message about your beloved pet..." 
                          required></textarea>
            </div>
            
            <button type="submit">Create Memorial</button>
        </form>
        
        <div id="memorialOutput"></div>
    </main>

    <footer>
        &copy; 2026 Over the Rainbow
    </footer>

    <!-- This line goes at the BOTTOM of the file, right before </body> -->
    <script src="assets/js/memorial-builder.js"></script>
</body>
</html>
