<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Healing Agent - Over the Rainbow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'Cormorant Garamond', serif;
      background: #fdfbff;
      color: #5D3FD3;
      margin: 0;
      text-align: center;
    }

    header {
      padding: 40px 20px 20px 20px;
    }

    .agent-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto 60px auto;
      padding: 0 20px;
    }

    iframe {
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    footer {
      padding: 25px;
      background: #fff;
      border-top: 1px solid #eee;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Healing Support Agent</h1>
    <p>A gentle space for comforting conversation and emotional support.</p>
  </header>

  <div class="agent-container">
    <iframe 
      src="https://agent.ai/agent/x9818qg581ivqrmi"
      allow="microphone"
    ></iframe>
  </div>

  <footer>
    &copy; <span id="year"></span> Over the Rainbow. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
