<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Your Tribute</title>

    <!-- Correct CSS path for a file inside /assets/ -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../tribute-wall.html">Tribute Wall</a></li>
            <li><a href="customize.html">Customize</a></li>
            <li><a href="../shop.html">Virtual Shop</a></li>
            <li><a href="../healing-agent.html">Healing Agent</a></li>
            <li><a href="../memorial-builder.html">Memorial Builder</a></li>
        </ul>
    </nav>

    <main>
        <h1>Customize Your Tribute</h1>
        <p>Create a personalized headstone or memorial design for your beloved pet.</p>

        <form id="customizeForm">
            <label for="petName">Pet's Name</label>
            <input type="text" id="petName" placeholder="Enter your pet's name">

            <label for="dates">Dates (optional)</label>
            <input type="text" id="dates" placeholder="e.g., 2012 – 2024">

            <label for="message">Short Message</label>
            <textarea id="message" rows="4" placeholder="Write a short loving message"></textarea>

            <label for="symbol">Choose a Symbol</label>
            <select id="symbol">
                <option value="🌈">Rainbow</option>
                <option value="⭐">Star</option>
                <option value="🐾">Paw Prints</option>
                <option value="🕊️">Dove</option>
                <option value="🌙">Moon</option>
            </select>

            <button type="button" onclick="generatePreview()">Generate Preview</button>
        </form>

        <div id="previewOutput"></div>
    </main>

    <footer>
        &copy; 2026 Over the Rainbow.
    </footer>

    <script>
        function generatePreview() {
            const name = document.getElementById("petName").value.trim();
            const dates = document.getElementById("dates").value.trim();
            const message = document.getElementById("message").value.trim();
            const symbol = document.getElementById("symbol").value;

            if (!name) {
                alert("Please enter your pet's name.");
                return;
            }

            const output = `
                <div style="padding: 20px; background: rgba(255,255,255,0.1); border-radius: 12px; margin-top: 30px;">
                    <h2>${symbol} ${name} ${symbol}</h2>
                    ${dates ? `<p><strong>${dates}</strong></p>` : ""}
                    <p>${message}</p>
                </div>
            `;

            document.getElementById("previewOutput").innerHTML = output;
        }
    </script>

</body>
</html>
