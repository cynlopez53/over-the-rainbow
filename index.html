<head>

    <title>Welcome to Over the Rainbow</title>
    <style>
        /* 1. Page Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            /* Update this path if your image folder name is different */
            background-image: url('assets/images/rainbow-bridge.jpg') !important;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 2. Navigation Styling */
        nav ul {
            list-style-type: none;
            padding: 20px;
            margin: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #4a4e69;
            font-weight: bold;
        }

        /* 3. Main Content (See-through for the Bridge Image) */
        main {
            flex: 1;
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            text-align: center;
            /* 0.6 makes the box semi-transparent so the bridge shows through */
            background: rgba(255, 255, 255, 0.6); 
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2d3436;
            font-size: 2.5em;
        }

        /* 4. Action Buttons */
        .buttons a {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            background-color: #a2d2ff;
            text-decoration: none;
            color: #2d3436;
            border-radius: 30px;
            font-weight: bold;
        }

        /* 5. Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }
    </style>
</head>
