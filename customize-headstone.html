<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="tribute-wall.html">Tribute Wall</a></li>

  </ul>
</nav>

<main class="page">
  <h1>Customize Headstone</h1>
  <p>Personalize your loved one's headstone below.</p>
  <form id="headstone-form" class="soft-form">
    <div class="form-row">
      <label for="headstoneName">Name</label>
      <input type="text" id="headstoneName" name="headstoneName" required>
    </div>
    <div class="form-row">
      <label for="headstoneDates">Dates</label>
      <input type="text" id="headstoneDates" name="headstoneDates" placeholder="e.g. 1940–2023">
    </div>
    <div class="form-row">
      <label for="headstoneMessage">Message</label>
      <input type="text" id="headstoneMessage" name="headstoneMessage" maxlength="60">
    </div>
    <button type="submit" class="btn">Preview Headstone</button>
  </form>

  <div id="headstone-preview" style="border: 1px solid #ccc; padding: 20px; margin-top: 20px; display:none;">
    <h2 id="preview-name"></h2>
    <p id="preview-dates"></p>
    <p id="preview-message"></p>
  </div>
</main>

<footer>© 2026 Over the Rainbow</footer>

<script>
document.getElementById('headstone-form').addEventListener('submit', function(e) {
  e.preventDefault();
  document.getElementById('headstone-preview').style.display = 'block';
  document.getElementById('preview-name').textContent = document.getElementById('headstoneName').value;
  document.getElementById('preview-dates').textContent = document.getElementById('headstoneDates').value;
  document.getElementById('preview-message').textContent = document.getElementById('headstoneMessage').value;
});
</script>
</body>
</html>
