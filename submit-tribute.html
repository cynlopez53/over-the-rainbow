<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Tribute - Over the Rainbow</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    background: #f4f2f8;
}

/* Navigation */
nav {
    background: white;
    padding: 15px 0;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

nav ul li {
    display: inline-block;
    margin: 0 15px;
}

nav a {
    text-decoration: none;
    color: #6a4ca3;
    font-weight: 600;
}

/* Main Form Card */
main {
    max-width: 700px;
    margin: 60px auto;
    padding: 40px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.08);
}

main h1 {
    text-align: center;
    color: #6a4ca3;
    margin-bottom: 10px;
}

main p {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

label {
    font-weight: 600;
    display: block;
    margin-top: 20px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: inherit;
}

textarea {
    resize: vertical;
}

button {
    margin-top: 25px;
    padding: 12px 20px;
    background: #6a4ca3;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #573a8c;
}

/* Footer */
footer {
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    color: #777;
    font-size: 14px;
}
</style>

</head>
<body>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="tribute-wall.html">Tribute Wall</a></li>
        <li><a href="healing-agent.html">Healing Agent</a></li>
        <li><a href="donate.html">Donate</a></li>
    </ul>
</nav>

<main>
    <h1>Submit a Tribute</h1>
    <p>Share a memory about your beloved companion.</p>

    <form id="tributeForm">
        <label>Pet's Name</label>
        <input type="text" id="name" required>

        <label>Type of Pet</label>
        <input type="text" id="type" required>

        <label>Birth Date</label>
        <input type="date" id="birth">

        <label>Passing Date</label>
        <input type="date" id="passing">

        <label>Your Message</label>
        <textarea id="message" rows="5" required></textarea>

        <button type="submit">Save Tribute</button>
    </form>
</main>

<footer>
    © 2026 Over the Rainbow · A place of love and remembrance
</footer>

<script>
document.getElementById("tributeForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const tributes = JSON.parse(localStorage.getItem("tributes")) || [];

    const newTribute = {
        name: document.getElementById("name").value,
        type: document.getElementById("type").value,
        birth: document.getElementById("birth").value,
        passing: document.getElementById("passing").value,
        message: document.getElementById("message").value
    };

    tributes.push(newTribute);
    localStorage.setItem("tributes", JSON.stringify(tributes));

    alert("Your tribute has been saved.");
    window.location.href = "tribute-wall.html";
});
</script>

</body>
</html>
